[project]
name = "agentlab"
version = "0.0.1"
description = "Agent Reliability Lab: trace, replay, fork, blame and diff AI agent runs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai",
    "pydantic>=2",
    "python-dotenv",
]

[project.scripts]
lab = "agentlab.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlab", "agents"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Docs are hand-formatted; keep ruff out of their code blocks.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
